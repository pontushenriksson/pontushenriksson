name: Generate snake animation

on:
  schedule: # every 12 hours
    - cron: '0 */12 * * *'

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Light and dark variants in the signal orange from pontushenriksson.com.
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF5A1F&color_dots=#ebedf0,#ffd9c9,#ffad8c,#ff8150,#FF5A1F
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF5A1F&color_dots=#161b22,#4a2314,#8a3a1c,#cc4a1e,#FF5A1F

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
